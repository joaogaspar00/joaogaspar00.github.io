<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contactar — João Gaspar</title>
<meta name="description" content="Contactar João Gaspar — Engenheiro Aeroespacial.">
<link rel="icon" type="image/svg+xml" href="logo-jg.svg">

<link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">

<link rel="stylesheet" href="style.css">
<style>
  /* esta página não faz parte do percurso de scroll — só precisa de
     um ecrã com o mesmo céu estrelado do estado "espaço". Sem altura
     fixa nem overflow:hidden: em ecrãs curtos, ou com o teclado do
     telemóvel aberto, o formulário tem de poder fazer scroll. */
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(ellipse at 50% 30%, #10131c 0%, #05060a 70%);
  }

  .stars { height: 100vh; height: 100dvh; opacity: 1; }
  .nebula { opacity: 1; }
</style>
</head>
<body>

<div class="grid-overlay" aria-hidden="true"></div>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="nebula" id="nebula" aria-hidden="true"></div>

<a href="index.html" class="contact-back" aria-label="Voltar ao início">
  <img src="logo-jg.svg" alt="">
</a>

<main class="contact-wrap">
  <div class="contact-card">
    <!-- coluna esquerda: apresentação + contactos diretos, para quem
         prefere não usar o formulário -->
    <div class="contact-intro">
      <span class="final-tag"><span class="final-tag-dot"></span>OPEN TO NEW OPPORTUNITIES</span>
      <h1 class="contact-title">Vamos falar</h1>
      <p class="final-text">Oportunidades em aerodinâmica, CFD, propulsão ou tecnologia reutilizável — ou só uma pergunta. Envia uma mensagem e respondo o mais rápido possível.</p>

      <ul class="contact-direct">
        <li>
          <span class="contact-direct-label">LINKEDIN</span>
          <a href="https://www.linkedin.com/in/joaogaspar00/" target="_blank" rel="noopener noreferrer">in/joaogaspar00</a>
        </li>
        <li>
          <span class="contact-direct-label">CV</span>
          <a href="CV.pdf" download>Download CV (PDF)</a>
        </li>
      </ul>
    </div>

    <form id="contact-form" class="contact-form" action="https://formspree.io/f/xdaqanqg" method="POST">
      <input type="hidden" name="_subject" value="Nova mensagem — joaopsgaspar.pt">
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

      <div class="contact-row">
        <div class="contact-field">
          <label class="contact-label" for="name">Nome</label>
          <input class="contact-input" type="text" id="name" name="name" autocomplete="name" maxlength="100" required>
        </div>
        <div class="contact-field">
          <label class="contact-label" for="email">Email</label>
          <input class="contact-input" type="email" id="email" name="email" autocomplete="email" maxlength="200" required>
        </div>
      </div>

      <div class="contact-field contact-field-grow">
        <label class="contact-label" for="message">Mensagem</label>
        <textarea class="contact-input" id="message" name="message" rows="6" maxlength="5000" placeholder="Olá João, …" required></textarea>
      </div>

      <button type="submit" class="final-btn final-btn-primary contact-submit">Enviar mensagem</button>
      <p id="contact-status" class="contact-status" role="status"></p>
    </form>
  </div>
</main>

<footer id="site-footer">
  <span class="brand">João Gaspar &copy; 2026</span>
  <div class="socials">
    <a href="https://github.com/joaogaspar00" target="_blank" rel="noopener noreferrer" aria-label="GitHub">

    </a>
    <a href="https://www.linkedin.com/in/joaogaspar00/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.45-2.14 2.94v5.66H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45Z"/></svg>

    <a href="contact.html" aria-label="Contactar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="M3 6.5l9 6.5 9-6.5"/></svg>
    </a>
  </div>
</footer>

<script src="common.js"></script>
<script src="contact.js"></script>
</body>
</html>
