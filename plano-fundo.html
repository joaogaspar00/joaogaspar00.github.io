<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de fundo — percurso chão → espaço</title>
<style>
  :root {
    --bg-ground: #6f97bf;
    --bg-ground-deep: #3c5f82;
    --bg-troposfera: #151923;
    --bg-estratosfera: #10131c;
    --bg-termosfera: #0b0e18;
    --bg-espaco: #05060a;
    --accent-purple: #7c6cf0;
    --accent-purple-soft: #9686ff;
    --text-primary: #e8e6f0;
    --text-muted: #6b6a78;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
    height: 600vh;
    position: relative;
    background: linear-gradient(
      to top,
      var(--bg-ground) 0%,
      var(--bg-ground-deep) 8%,
      var(--bg-troposfera) 20%,
      var(--bg-estratosfera) 42%,
      var(--bg-termosfera) 68%,
      var(--bg-espaco) 100%
    );
  }

  /* nota: gradiente vai de baixo (chão) para cima (espaço).
     no site final o scroll é invertido, mas aqui usamos scroll normal
     só para testarmos as cores com mais facilidade. */

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #ffffff;
  }

  .nebula {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .nebula::before,
  .nebula::after {
    content: "";
    position: absolute;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    filter: blur(90px);
  }

  .nebula::before {
    top: 10%;
    left: 15%;
    background: var(--accent-purple);
    opacity: 0.10;
  }

  .nebula::after {
    top: 40%;
    right: 10%;
    background: var(--accent-purple-soft);
    opacity: 0.07;
  }

  .launchpad {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 42vh;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: 1;
  }

  .launchpad svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  #site-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: rgba(11, 13, 18, 0.75);
    border-top: 0.5px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px);
    z-index: 20;
  }

  #site-footer .brand {
    font-size: 13px;
    color: var(--text-muted);
  }

  #site-footer .socials {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  #site-footer .socials a {
    color: var(--text-muted);
    display: flex;
    align-items: center;
    transition: color 0.2s ease;
  }

  #site-footer .socials a:hover {
    color: var(--accent-purple-soft);
  }

  .zone {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }


  .zone-label {
    text-align: center;
  }

  .zone-label .eyebrow {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    display: block;
    margin-bottom: 8px;
  }

  .zone-label .name {
    font-size: 32px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .zone-label .hex {
    display: block;
    margin-top: 10px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 13px;
    color: var(--accent-purple-soft);
  }


  #progress {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 2px;
    height: 240px;
    background: rgba(255,255,255,0.08);
    z-index: 10;
  }

  #progress-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: var(--accent-purple);
    height: 0%;
    transition: height 0.1s linear;
  }

  #progress .tick {
    position: absolute;
    right: 8px;
    font-size: 10px;
    color: var(--text-muted);
    white-space: nowrap;
    transform: translateY(50%);
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>
  <div class="nebula" id="nebula"></div>
  <div class="launchpad" id="launchpad">
    <svg viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice">
      <path d="M0 400 L0 300 L260 260 L600 340 L940 260 L1200 300 L1200 400 Z" fill="#0f1319" opacity="0.5"/>

      <line x1="0" y1="340" x2="1200" y2="340" stroke="#232733" stroke-width="2"/>

      <line x1="760" y1="340" x2="760" y2="60" stroke="#262b38" stroke-width="7"/>
      <line x1="702" y1="340" x2="702" y2="150" stroke="#262b38" stroke-width="4"/>

      <line x1="702" y1="150" x2="760" y2="200" stroke="#2e3444" stroke-width="2.5"/>
      <line x1="760" y1="150" x2="702" y2="200" stroke="#2e3444" stroke-width="2.5"/>
      <line x1="702" y1="200" x2="760" y2="255" stroke="#2e3444" stroke-width="2.5"/>
      <line x1="760" y1="200" x2="702" y2="255" stroke="#2e3444" stroke-width="2.5"/>
      <line x1="702" y1="255" x2="760" y2="340" stroke="#2e3444" stroke-width="2.5"/>
      <line x1="760" y1="255" x2="702" y2="340" stroke="#2e3444" stroke-width="2.5"/>

      <rect x="558" y="146" width="146" height="9" rx="1" fill="#333a4a"/>
      <rect x="558" y="146" width="10" height="9" fill="#4a5268"/>

      <circle cx="760" cy="60" r="4.5" fill="#9686ff"/>
      <circle cx="760" cy="150" r="3.5" fill="#7c6cf0"/>
      <circle cx="702" cy="150" r="3.5" fill="#7c6cf0"/>
      <circle cx="760" cy="255" r="3.5" fill="#7c6cf0"/>
    </svg>
  </div>

  <div id="progress">
    <div id="progress-fill"></div>
    <span class="tick" style="bottom:0%">chão</span>
    <span class="tick" style="bottom:20%">troposfera</span>
    <span class="tick" style="bottom:42%">estratosfera</span>
    <span class="tick" style="bottom:68%">termosfera</span>
    <span class="tick" style="bottom:100%">espaço</span>
  </div>

  <div id="site-footer">
    <span class="brand">João Gaspar &copy; 2026</span>
    <div class="socials">
      <a href="#" aria-label="GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.5 0 12.3c0 5.44 3.44 10.05 8.21 11.68.6.11.82-.27.82-.6 0-.3-.01-1.08-.02-2.12-3.34.75-4.04-1.65-4.04-1.65-.55-1.43-1.34-1.82-1.34-1.82-1.09-.77.08-.75.08-.75 1.2.09 1.84 1.27 1.84 1.27 1.07 1.87 2.81 1.33 3.5 1.02.11-.79.42-1.33.76-1.64-2.66-.31-5.47-1.36-5.47-6.03 0-1.33.46-2.42 1.22-3.28-.12-.31-.53-1.56.12-3.26 0 0 1-.33 3.3 1.25a11.2 11.2 0 0 1 6 0c2.29-1.58 3.3-1.25 3.3-1.25.65 1.7.24 2.95.12 3.26.76.86 1.22 1.95 1.22 3.28 0 4.68-2.81 5.71-5.49 6.02.43.38.81 1.13.81 2.28 0 1.65-.02 2.98-.02 3.38 0 .33.22.72.83.6C20.57 22.34 24 17.74 24 12.3 24 5.5 18.63 0 12 0Z"/></svg>
      </a>
      <a href="#" aria-label="LinkedIn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.45-2.14 2.94v5.66H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45Z"/></svg>
      </a>
      <a href="#" aria-label="Email">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="M3 6.5l9 6.5 9-6.5"/></svg>
      </a>
    </div>
  </div>

  <div class="zone" style="height:200vh">
    <div class="zone-label">
      <span class="eyebrow">estado atual</span>
      <span class="name">espaço</span>
      <span class="hex">#05060a</span>
    </div>
  </div>

  <div class="zone" style="height:100vh">
    <div class="zone-label">
      <span class="eyebrow">transição</span>
      <span class="name">termosfera</span>
      <span class="hex">#0b0e18</span>
    </div>
  </div>

  <div class="zone" style="height:100vh">
    <div class="zone-label">
      <span class="eyebrow">investigação</span>
      <span class="name">estratosfera</span>
      <span class="hex">#10131c</span>
    </div>
  </div>

  <div class="zone" style="height:80vh">
    <div class="zone-label">
      <span class="eyebrow">experiência</span>
      <span class="name">troposfera</span>
      <span class="hex">#151923</span>
    </div>
  </div>

  <div class="zone" style="height:20vh">
    <div class="zone-label">
      <span class="eyebrow">origem</span>
      <span class="name">chão</span>
      <span class="hex">#6f97bf</span>
    </div>
  </div>

<script>
  const starsEl = document.getElementById('stars');
  const starCount = 140;
  for (let i = 0; i < starCount; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    const size = Math.random() < 0.8 ? 1 : 2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.opacity = (0.2 + Math.random() * 0.6).toFixed(2);
    starsEl.appendChild(s);
  }

  const zones = [
    { name: 'chão',         hex: '#6f97bf', from: 0,    to: 0.20 },
    { name: 'troposfera',   hex: '#151923', from: 0.20, to: 0.42 },
    { name: 'estratosfera', hex: '#10131c', from: 0.42, to: 0.68 },
    { name: 'termosfera',   hex: '#0b0e18', from: 0.68, to: 0.85 },
    { name: 'espaço',       hex: '#05060a', from: 0.85, to: 1.0 }
  ];

  const nebulaEl = document.getElementById('nebula');
  const launchpadEl = document.getElementById('launchpad');
  const fillEl = document.getElementById('progress-fill');

  function onScroll() {
    const scrollTop = window.scrollY;
    const max = document.body.scrollHeight - window.innerHeight;
    /* chão fica no fundo da página (scrollTop = max) => frac = 0
       espaço fica no topo da página (scrollTop = 0)   => frac = 1
       scroll para cima faz frac subir, tal como no lançamento real */
    const frac = Math.min(Math.max(1 - scrollTop / max, 0), 1);

    fillEl.style.height = (frac * 100) + '%';

    const starsOpacity = Math.max(0, (frac - 0.18) / 0.82);
    starsEl.style.opacity = starsOpacity.toFixed(2);

    const nebulaOpacity = Math.max(0, (frac - 0.65) / 0.35);
    nebulaEl.style.opacity = nebulaOpacity.toFixed(2);

    launchpadEl.style.opacity = frac < 0.16 ? (1 - frac / 0.16).toFixed(2) : 0;

    const current = zones.find(z => frac >= z.from && frac <= z.to) || zones[zones.length - 1];
  }

  window.addEventListener('scroll', onScroll);
  window.addEventListener('load', () => {
    window.scrollTo(0, document.body.scrollHeight);
    onScroll();
  });
  onScroll();
</script>

</body>
</html>
