<svg width="236" height="375" viewBox="222 50 236 375" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Ilustração técnica de um foguetão com chama animada no propulsor</title>
<desc>Foguetão metálico roxo-acinzentado com linhas de painel, bocal do motor e chama animada encostada à base, sobre fundo transparente.</desc>
<style>
@keyframes flick1 { 0%{transform:scaleY(1) scaleX(1);opacity:1;} 50%{transform:scaleY(1.1) scaleX(0.95);opacity:0.92;} 100%{transform:scaleY(1) scaleX(1);opacity:1;} }
@keyframes flick2 { 0%{transform:scaleY(1) scaleX(1);} 50%{transform:scaleY(0.92) scaleX(1.06);} 100%{transform:scaleY(1) scaleX(1);} }
@keyframes flick3 { 0%{transform:scaleY(1);opacity:0.95;} 50%{transform:scaleY(1.15);opacity:1;} 100%{transform:scaleY(1);opacity:0.95;} }
.f1{transform-origin:340px 340px;animation:flick1 0.55s ease-in-out infinite;}
.f2{transform-origin:340px 338px;animation:flick2 0.42s ease-in-out infinite;}
.f3{transform-origin:340px 336px;animation:flick3 0.34s ease-in-out infinite;}
</style>

<g class="f1">
<path d="M304 340 C304 368 316 394 340 412 C364 394 376 368 376 340 Z" fill="#993c1d"/>
</g>
<g class="f2">
<path d="M314 338 C314 360 323 382 340 398 C357 382 366 360 366 338 Z" fill="#d85a30"/>
</g>
<g class="f3">
<path d="M324 336 C324 353 330 370 340 382 C350 370 356 353 356 336 Z" fill="#f0997b"/>
</g>

